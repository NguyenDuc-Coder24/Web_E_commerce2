<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Admin</title><link rel="stylesheet" href="./css/style.css"></head><body><main class="container"><section class="card"><h2>Dashboard</h2><div id="dashboardStats" class="stats"></div></section><section class="card"><h2>Quản lý sản phẩm</h2><form id="productForm" class="grid-2"><input id="name" placeholder="Tên" required><input id="price" type="number" step="0.01" placeholder="Giá" required><input id="category_id" type="number" placeholder="Category ID" required><input id="stock_quantity" type="number" placeholder="Kho" required><input id="image_url" placeholder="Image URL"><textarea id="description" placeholder="Mô tả"></textarea><button>Thêm sản phẩm</button></form><div id="productTable"></div></section><section class="card"><h2>Quản lý đơn hàng</h2><div id="orderTable"></div></section><section class="card"><h2>Quản lý người dùng</h2><div id="userTable"></div></section><section class="card"><h2>Coupon</h2><form id="couponForm" class="grid-2"><input id="code" placeholder="Mã coupon" required><input id="discount_percent" type="number" placeholder="% giảm" required><input id="expiry_date" type="date"><button>Tạo coupon</button></form><div id="couponTable"></div></section></main><div id="toast" class="toast"></div><script src="./js/admin.js"></script></body></html>
