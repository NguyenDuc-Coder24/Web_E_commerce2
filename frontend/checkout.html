<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Thanh toán</title><link rel="stylesheet" href="./css/style.css"></head><body><main class="container"><section class="card"><h2>Giỏ hàng</h2><div id="cartItems"></div></section><section class="card"><h2>Thông tin giao hàng</h2><form id="checkoutForm"><input id="address" placeholder="Địa chỉ" required><input id="phone" placeholder="Số điện thoại" required><select id="paymentMethod"><option value="cod">COD</option><option value="bank">Chuyển khoản nhanh</option><option value="bank_transfer">Chuyển khoản ngân hàng</option></select><p id="bankNote" class="muted" style="display:none">Nội dung CK: NOVASHOP + SĐT. STK: 123456789 - Ngân hàng ABC.</p><input id="coupon" placeholder="Mã giảm giá"><button type="button" id="applyCouponBtn">Áp dụng coupon</button><p id="couponResult"></p><button>Đặt hàng</button></form></section></main><div id="toast" class="toast"></div><script src="./js/checkout.js"></script></body></html>
